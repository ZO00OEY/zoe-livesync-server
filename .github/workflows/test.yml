name: Test installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
      - name: Unit tests
        run: bash scripts/self-test.sh
      - name: Validate Compose model
        run: |
          cp /dev/null .env
          printf '%s\n' \
            'COUCHDB_USER=test_user' \
            'COUCHDB_PASSWORD=0123456789abcdef0123456789abcdef' \
            'COUCHDB_DATABASE=obsidiannotes' \
            'HTTPS_PORT=8443' > .env
          docker compose config --quiet
      - name: Generate a Self-hosted LiveSync setup URI
        run: |
          test_dir="$(mktemp -d)"
          trap 'rm -rf "${test_dir}"' EXIT
          cat > "${test_dir}/.env" <<'EOF'
          PUBLIC_URL=https://127.0.0.1:23456
          COUCHDB_DATABASE=obsidiannotes
          COUCHDB_USER=test_user
          COUCHDB_PASSWORD=0123456789abcdef0123456789abcdef
          VAULT_PASSPHRASE=11111111111111111111111111111111
          SETUP_URI_PASSPHRASE=22222222222222222222222222222222
          EOF
          ZOE_INSTALL_DIR="${test_dir}" bash scripts/generate-setup-uri.sh >/dev/null
          uri="$(cat "${test_dir}/setup-uri-only.txt")"
          [[ "${uri}" == "obsidian://setuplivesync?settings="* ]]
          [[ "${uri}" != *[[:space:]]* ]]
          [[ "$(wc -l < "${test_dir}/setup-uri-only.txt")" -eq 1 ]]
          grep -Fq "${uri}" "${test_dir}/setup-uri.txt"
          grep -Fq 'Setup URI 保护口令: 22222222222222222222222222222222' "${test_dir}/setup-uri.txt"
