name: Test installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
      - name: Unit tests
        run: bash scripts/self-test.sh
      - name: Validate Compose model
        run: |
          cp /dev/null .env
          printf '%s\n' \
            'COUCHDB_USER=test_user' \
            'COUCHDB_PASSWORD=0123456789abcdef0123456789abcdef' \
            'COUCHDB_DATABASE=obsidiannotes' \
            'HTTPS_PORT=8443' > .env
          docker compose config --quiet
      - name: Generate a Self-hosted LiveSync setup URI
        run: |
          output="$(docker run --rm \
            -e hostname=https://127.0.0.1:23456 \
            -e database=obsidiannotes \
            -e username=test_user \
            -e password=0123456789abcdef0123456789abcdef \
            -e passphrase=11111111111111111111111111111111 \
            -e uri_passphrase=22222222222222222222222222222222 \
            denoland/deno:alpine-2.9.7 run --minimum-dependency-age=0 --allow-env \
            https://raw.githubusercontent.com/vrtmrz/obsidian-livesync/2c2b9c90e4e10a454f2838c63ba656c0e67a374c/utils/setup/generate_setup_uri.ts)"
          grep -Fq 'obsidian://setuplivesync?' <<< "${output}"
