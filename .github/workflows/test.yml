name: Test installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
      - name: Unit tests
        run: bash scripts/self-test.sh
      - name: Validate Compose model
        run: |
          cp /dev/null .env
          printf '%s\n' \
            'COUCHDB_USER=test_user' \
            'COUCHDB_PASSWORD=0123456789abcdef0123456789abcdef' \
            'COUCHDB_DATABASE=obsidiannotes' \
            'HTTPS_PORT=8443' > .env
          docker compose config --quiet
