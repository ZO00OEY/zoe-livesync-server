services:
  couchdb:
    image: couchdb:3.5.2.1
    container_name: zoe-livesync-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?COUCHDB_USER is required}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?COUCHDB_PASSWORD is required}
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ./config/livesync.ini:/opt/couchdb/etc/local.ini
    ports:
      - "127.0.0.1:5984:5984"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -u $${COUCHDB_USER}:$${COUCHDB_PASSWORD} http://localhost:5984/_session | grep -q ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - livesync

  couchdb-init:
    image: denoland/deno:alpine-2.9.7
    container_name: zoe-livesync-init
    restart: "no"
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      hostname: http://couchdb:5984
      username: ${COUCHDB_USER}
      password: ${COUCHDB_PASSWORD}
      database: ${COUCHDB_DATABASE:-obsidiannotes}
      retry_count: 12
      retry_delay_ms: 5000
    volumes:
      - ./scripts/provision-couchdb.ts:/provision-couchdb.ts:ro
    entrypoint:
      ["deno", "run", "--allow-env", "--allow-net", "/provision-couchdb.ts"]
    networks:
      - livesync

  caddy:
    image: caddy:2.11.4-alpine
    container_name: zoe-livesync-caddy
    restart: unless-stopped
    depends_on:
      couchdb:
        condition: service_healthy
    ports:
      - "${HTTPS_PORT:?HTTPS_PORT is required}:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      - livesync

volumes:
  couchdb-data:

networks:
  livesync:
