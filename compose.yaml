services:
  couchdb:
    image: couchdb:3.5.2.1
    container_name: zoe-livesync-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?COUCHDB_USER is required}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?COUCHDB_PASSWORD is required}
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ./config/livesync.ini:/opt/couchdb/etc/local.ini
    ports:
      - "127.0.0.1:5984:5984"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u $${COUCHDB_USER}:$${COUCHDB_PASSWORD} http://localhost:5984/_session | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - livesync

  couchdb-init:
    image: curlimages/curl:8.16.0
    container_name: zoe-livesync-init
    restart: "no"
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_INTERNAL_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidiannotes}
    volumes:
      - ./scripts/couchdb-init.sh:/couchdb-init.sh:ro
    entrypoint: ["sh", "/couchdb-init.sh"]
    networks:
      - livesync

  caddy:
    image: caddy:2.11.4-alpine
    container_name: zoe-livesync-caddy
    restart: unless-stopped
    depends_on:
      couchdb:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ./acme-webroot:/srv/acme:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - livesync

volumes:
  couchdb-data:
  caddy-data:
  caddy-config:

networks:
  livesync:
